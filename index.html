<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video</title>

  <style>
    body {
      margin: 0;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden; /* prevents scrollbars */
    }

    .video-wrapper {
      width: 100%;
      max-width: 500px; /* adjust if you want */
      aspect-ratio: 9 / 16; /* portrait video */
    }

    .video-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }
  </style>
</head>

<body>

  <div class="video-wrapper">
    <iframe
      src="https://player.vimeo.com/video/1162275389?autoplay=1&muted=1&loop=1&autopause=0&title=0&byline=0&portrait=0&badge=0"
      allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
      title="akhhiportf1">
    </iframe>
  </div>

</body>
</html>
